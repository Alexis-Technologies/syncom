<svg xmlns="http://www.w3.org/2000/svg" width="760" height="331" viewBox="0 0 760 331" role="img" aria-label="Hash: syncom's own benchmarks. The digest behind the chain and the integrity checks. ops/s, log scale, higher is better.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
