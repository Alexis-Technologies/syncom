<svg xmlns="http://www.w3.org/2000/svg" width="760" height="988" viewBox="0 0 760 988" role="img" aria-label="Apply: syncom's own benchmarks. A peer's page once it has arrived: admit, fold, append, write, announce. The applyRemote rows count ops. ops/s, log scale, higher is better.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 700; fill: #1b1c1e; }
  .subtitle, .caption { font-size: 12px; fill: #67676c; }
