<svg xmlns="http://www.w3.org/2000/svg" width="760" height="708" viewBox="0 0 760 708" role="img" aria-label="Apply: syncom's own benchmarks. A peer's page once it has arrived: admit, fold, append, write, announce. The applyRemote rows count ops. ops/s, log scale, higher is better.">
<style>
