<text class="sublabel" x="20" y="120">one op</text>
<path class="bar primary" d="M285,101H461.44701292316927A4,4 0 0 1 465.44701292316927,105V111A4,4 0 0 1 461.44701292316927,115H285Z"/>
<text class="value" x="471.44701292316927" y="114">5,875</text>
</g>
