<svg xmlns="http://www.w3.org/2000/svg" width="760" height="428" viewBox="0 0 760 428" role="img" aria-label="Op log: syncom's own benchmarks. OpLog, the persisted operation log every write and every replicated op goes through. ops/s, log scale, higher is better.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 700; fill: #1b1c1e; }
  .subtitle, .caption { font-size: 12px; fill: #67676c; }
  .caption { font-size: 11px; }
  .group { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; fill: #67676c; }
  .label { font-size: 13px; font-weight: 600; fill: #1b1c1e; }
  .label.primary, .label.secondary { font-weight: 700; }
  .sublabel { font-size: 11px; fill: #67676c; }
  .value { font-size: 12px; font-weight: 600; fill: #3c3c43; font-variant-numeric: tabular-nums; }
  .value.small { font-size: 10px; }
  .legend { font-size: 11px; fill: #3c3c43; }
  .tick { font-size: 11px; fill: #67676c; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e4e4e7; stroke-width: 1; }
  .axis { stroke: #c2c2c4; stroke-width: 1; }
  .ref { stroke: #67676c; stroke-width: 1; stroke-dasharray: 3 3; }
  .bar { fill: #c4c6cc; }
  .bar.primary { fill: #245a9e; }
  .bar.secondary { fill: #5e9be6; }
  @media (prefers-color-scheme: dark) {
    .title, .label { fill: #dfdfd6; }
    .subtitle, .caption, .group, .sublabel, .tick { fill: #98989f; }
    .value, .legend { fill: #c2c2c4; }
    .grid { stroke: #2e2e32; }
    .axis { stroke: #48484c; }
    .ref { stroke: #98989f; }
    .bar { fill: #46474e; }
    .bar.primary { fill: #8dbcf2; }
    .bar.secondary { fill: #3d7bd0; }
  }
</style>
<text class="title" x="20" y="35">Op log: syncom's own benchmarks</text>
<text class="subtitle" x="20" y="56">OpLog, the persisted operation log every write and every replicated op goes through. ops/s, log scale, higher is</text>
<text class="subtitle" x="20" y="73">better.</text>
<line class="grid" x1="285" y1="88" x2="285" y2="368"/>
<text class="tick" x="285" y="384" text-anchor="middle">10</text>
<line class="grid" x1="350.16666666666663" y1="88" x2="350.16666666666663" y2="368"/>
<text class="tick" x="350.16666666666663" y="384" text-anchor="middle">100</text>
<line class="grid" x1="415.3333333333333" y1="88" x2="415.3333333333333" y2="368"/>
<text class="tick" x="415.3333333333333" y="384" text-anchor="middle">1,000</text>
<line class="grid" x1="480.5" y1="88" x2="480.5" y2="368"/>
<text class="tick" x="480.5" y="384" text-anchor="middle">10k</text>
<line class="grid" x1="545.6666666666666" y1="88" x2="545.6666666666666" y2="368"/>
<text class="tick" x="545.6666666666666" y="384" text-anchor="middle">100k</text>
<line class="grid" x1="610.8333333333334" y1="88" x2="610.8333333333334" y2="368"/>
<text class="tick" x="610.8333333333334" y="384" text-anchor="middle">1M</text>
<line class="grid" x1="676" y1="88" x2="676" y2="368"/>
<text class="tick" x="676" y="384" text-anchor="middle">10M</text>
<line class="axis" x1="285" y1="88" x2="285" y2="368"/>
