<text class="sublabel" x="20" y="240">everything (no cursor)</text>
<path class="bar primary" d="M285,221H426.41743497639936A4,4 0 0 1 430.41743497639936,225V231A4,4 0 0 1 426.41743497639936,235H285Z"/>
<text class="value" x="436.41743497639936" y="234">1,704</text>
</g>
