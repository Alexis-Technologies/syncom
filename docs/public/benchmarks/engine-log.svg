<text class="sublabel" x="20" y="280">20 from the middle, scoped</text>
<path class="bar primary" d="M285,261H642.1979350478921A4,4 0 0 1 646.1979350478921,265V271A4,4 0 0 1 642.1979350478921,275H285Z"/>
<text class="value" x="652.1979350478921" y="274">3.49M</text>
</g>
