<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1268" viewBox="0 0 760 1268" role="img" aria-label="Lists and text: syncom's own benchmarks. The sequence engine behind list and text fields: a fold per op over Fugue runs, a reading, a join, a diff. ops/s, log scale, higher is better.">
<style>
