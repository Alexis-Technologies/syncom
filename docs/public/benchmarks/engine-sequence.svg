<svg xmlns="http://www.w3.org/2000/svg" width="760" height="628" viewBox="0 0 760 628" role="img" aria-label="Lists and text: syncom's own benchmarks. The sequence engine behind list and text fields: a fold per op over Fugue runs, a reading, a join, a diff. ops/s, log scale, higher is better.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 700; fill: #1b1c1e; }
  .subtitle, .caption { font-size: 12px; fill: #67676c; }
  .caption { font-size: 11px; }
  .group { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; fill: #67676c; }
  .label { font-size: 13px; font-weight: 600; fill: #1b1c1e; }
  .label.primary, .label.secondary { font-weight: 700; }
  .sublabel { font-size: 11px; fill: #67676c; }
  .value { font-size: 12px; font-weight: 600; fill: #3c3c43; font-variant-numeric: tabular-nums; }
  .value.small { font-size: 10px; }
  .legend { font-size: 11px; fill: #3c3c43; }
  .tick { font-size: 11px; fill: #67676c; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e4e4e7; stroke-width: 1; }
  .axis { stroke: #c2c2c4; stroke-width: 1; }
  .ref { stroke: #67676c; stroke-width: 1; stroke-dasharray: 3 3; }
  .bar { fill: #c4c6cc; }
  .bar.primary { fill: #245a9e; }
  .bar.secondary { fill: #5e9be6; }
  @media (prefers-color-scheme: dark) {
    .title, .label { fill: #dfdfd6; }
    .subtitle, .caption, .group, .sublabel, .tick { fill: #98989f; }
    .value, .legend { fill: #c2c2c4; }
    .grid { stroke: #2e2e32; }
    .axis { stroke: #48484c; }
    .ref { stroke: #98989f; }
    .bar { fill: #46474e; }
    .bar.primary { fill: #8dbcf2; }
    .bar.secondary { fill: #3d7bd0; }
  }
</style>
<text class="title" x="20" y="35">Lists and text: syncom's own benchmarks</text>
<text class="subtitle" x="20" y="56">The sequence engine behind list and text fields: a fold per op over Fugue runs, a reading, a join, a diff.</text>
<text class="subtitle" x="20" y="73">ops/s, log scale, higher is better.</text>
<line class="grid" x1="324" y1="88" x2="324" y2="568"/>
<text class="tick" x="324" y="584" text-anchor="middle">100</text>
<line class="grid" x1="412" y1="88" x2="412" y2="568"/>
<text class="tick" x="412" y="584" text-anchor="middle">1,000</text>
<line class="grid" x1="500" y1="88" x2="500" y2="568"/>
<text class="tick" x="500" y="584" text-anchor="middle">10k</text>
<line class="grid" x1="588" y1="88" x2="588" y2="568"/>
<text class="tick" x="588" y="584" text-anchor="middle">100k</text>
<line class="grid" x1="676" y1="88" x2="676" y2="568"/>
<text class="tick" x="676" y="584" text-anchor="middle">1M</text>
<line class="axis" x1="324" y1="88" x2="324" y2="568"/>
