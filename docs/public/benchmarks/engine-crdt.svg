<svg xmlns="http://www.w3.org/2000/svg" width="760" height="491" viewBox="0 0 760 491" role="img" aria-label="CRDT: syncom's own benchmarks. diff / merge / apply over plain objects, no I/O. ops/s, log scale, higher is better.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
