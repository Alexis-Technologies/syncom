<svg xmlns="http://www.w3.org/2000/svg" width="760" height="581" viewBox="0 0 760 581" role="img" aria-label="Insert a record, on disk. Add one record to a store of 1,000. Each library's own persistence on node:fs, every write awaited. ops/s, log scale, higher is better. Not shown: Yjs (memory only — on disk the Yjs row stores every update already); Loro (memory only — on disk the Loro row appends every update already); RxDB (Node.js disk storages are Premium).">
