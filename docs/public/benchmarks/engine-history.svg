<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348" role="img" aria-label="History: syncom's own benchmarks. The past out of the log: history() over a record with two thousand ops, a version a thousand ops back, its diff. ops/s, log scale, higher is better.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 700; fill: #1b1c1e; }
  .subtitle, .caption { font-size: 12px; fill: #67676c; }
  .caption { font-size: 11px; }
  .group { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; fill: #67676c; }
  .label { font-size: 13px; font-weight: 600; fill: #1b1c1e; }
  .label.primary, .label.secondary { font-weight: 700; }
  .sublabel { font-size: 11px; fill: #67676c; }
  .value { font-size: 12px; font-weight: 600; fill: #3c3c43; font-variant-numeric: tabular-nums; }
  .value.small { font-size: 10px; }
  .legend { font-size: 11px; fill: #3c3c43; }
  .tick { font-size: 11px; fill: #67676c; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e4e4e7; stroke-width: 1; }
  .axis { stroke: #c2c2c4; stroke-width: 1; }
  .ref { stroke: #67676c; stroke-width: 1; stroke-dasharray: 3 3; }
  .bar { fill: #c4c6cc; }
  .bar.primary { fill: #245a9e; }
  .bar.secondary { fill: #5e9be6; }
  @media (prefers-color-scheme: dark) {
    .title, .label { fill: #dfdfd6; }
    .subtitle, .caption, .group, .sublabel, .tick { fill: #98989f; }
    .value, .legend { fill: #c2c2c4; }
    .grid { stroke: #2e2e32; }
    .axis { stroke: #48484c; }
    .ref { stroke: #98989f; }
    .bar { fill: #46474e; }
    .bar.primary { fill: #8dbcf2; }
    .bar.secondary { fill: #3d7bd0; }
  }
</style>
<text class="title" x="20" y="35">History: syncom's own benchmarks</text>
<text class="subtitle" x="20" y="56">The past out of the log: history() over a record with two thousand ops, a version a thousand ops back, its diff.</text>
<text class="subtitle" x="20" y="73">ops/s, log scale, higher is better.</text>
<line class="grid" x1="271" y1="88" x2="271" y2="288"/>
<text class="tick" x="271" y="304" text-anchor="middle">100</text>
<line class="grid" x1="473.5" y1="88" x2="473.5" y2="288"/>
<text class="tick" x="473.5" y="304" text-anchor="middle">1,000</text>
<line class="grid" x1="676" y1="88" x2="676" y2="288"/>
<text class="tick" x="676" y="304" text-anchor="middle">10k</text>
<line class="axis" x1="271" y1="88" x2="271" y2="288"/>
<g><title>history(id, { limit: 50 }) · a record with 2 000 ops
801 ops/s
1.25 ms per operation</title>
<text class="label primary" x="20" y="105">history(id, { limit: 50 })</text>
<text class="sublabel" x="20" y="120">a record with 2 000 ops</text>
<path class="bar primary" d="M271,101H449.9855845070581A4,4 0 0 1 453.9855845070581,105V111A4,4 0 0 1 449.9855845070581,115H271Z"/>
<text class="value" x="459.9855845070581" y="114">801</text>
</g>
<g><title>history(id, { limit: Infinity }) · every version materialized
422 ops/s
2.37 ms per operation</title>
<text class="label primary" x="20" y="145">history(id, { limit: Infinity })</text>
<text class="sublabel" x="20" y="160">every version materialized</text>
<path class="bar primary" d="M271,141H393.625771319739A4,4 0 0 1 397.625771319739,145V151A4,4 0 0 1 393.625771319739,155H271Z"/>
<text class="value" x="403.625771319739" y="154">422</text>
</g>
<g><title>get(id, { at: eventId }) · 1 000 ops back
1,561 ops/s
641 µs per operation</title>
<text class="label primary" x="20" y="185">get(id, { at: eventId })</text>
<text class="sublabel" x="20" y="200">1 000 ops back</text>
<path class="bar primary" d="M271,181H508.6640878701396A4,4 0 0 1 512.6640878701396,185V191A4,4 0 0 1 508.6640878701396,195H271Z"/>
<text class="value" x="518.6640878701396" y="194">1,561</text>
</g>
<g><title>get(id, { at: { vector } }) · the present, folded
830 ops/s
1.2 ms per operation</title>
<text class="label primary" x="20" y="225">get(id, { at: { vector } })</text>
<text class="sublabel" x="20" y="240">the present, folded</text>
<path class="bar primary" d="M271,221H453.11331370615494A4,4 0 0 1 457.11331370615494,225V231A4,4 0 0 1 453.11331370615494,235H271Z"/>
<text class="value" x="463.11331370615494" y="234">830</text>
</g>
<g><title>diff(id, at) · against 1 000 ops back
1,564 ops/s
639 µs per operation</title>
<text class="label primary" x="20" y="265">diff(id, at)</text>
<text class="sublabel" x="20" y="280">against 1 000 ops back</text>
<path class="bar primary" d="M271,261H508.83294161657545A4,4 0 0 1 512.8329416165755,265V271A4,4 0 0 1 508.83294161657545,275H271Z"/>
<text class="value" x="518.8329416165755" y="274">1,564</text>
</g>
<text class="caption" x="20" y="329">pnpm bench --save · Apple M3 Max · 16 cores · Node v24.14.1 · 1 s per row · 2026-10-31</text>
</svg>
