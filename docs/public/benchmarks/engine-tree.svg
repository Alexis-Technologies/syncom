<svg xmlns="http://www.w3.org/2000/svg" width="760" height="308" viewBox="0 0 760 308" role="img" aria-label="Trees: syncom's own benchmarks. The movable tree behind tree fields: one move folded over a block of thousands, the fold read anew and read kept. ops/s, log scale, higher is better.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 700; fill: #1b1c1e; }
  .subtitle, .caption { font-size: 12px; fill: #67676c; }
  .caption { font-size: 11px; }
  .group { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; fill: #67676c; }
  .label { font-size: 13px; font-weight: 600; fill: #1b1c1e; }
  .label.primary, .label.secondary { font-weight: 700; }
  .sublabel { font-size: 11px; fill: #67676c; }
  .value { font-size: 12px; font-weight: 600; fill: #3c3c43; font-variant-numeric: tabular-nums; }
  .value.small { font-size: 10px; }
  .legend { font-size: 11px; fill: #3c3c43; }
  .tick { font-size: 11px; fill: #67676c; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e4e4e7; stroke-width: 1; }
  .axis { stroke: #c2c2c4; stroke-width: 1; }
  .ref { stroke: #67676c; stroke-width: 1; stroke-dasharray: 3 3; }
  .bar { fill: #c4c6cc; }
  .bar.primary { fill: #245a9e; }
  .bar.secondary { fill: #5e9be6; }
  @media (prefers-color-scheme: dark) {
    .title, .label { fill: #dfdfd6; }
    .subtitle, .caption, .group, .sublabel, .tick { fill: #98989f; }
    .value, .legend { fill: #c2c2c4; }
    .grid { stroke: #2e2e32; }
    .axis { stroke: #48484c; }
    .ref { stroke: #98989f; }
    .bar { fill: #46474e; }
    .bar.primary { fill: #8dbcf2; }
    .bar.secondary { fill: #3d7bd0; }
  }
</style>
<text class="title" x="20" y="35">Trees: syncom's own benchmarks</text>
<text class="subtitle" x="20" y="56">The movable tree behind tree fields: one move folded over a block of thousands, the fold read anew and read</text>
<text class="subtitle" x="20" y="73">kept. ops/s, log scale, higher is better.</text>
<line class="grid" x1="235" y1="88" x2="235" y2="248"/>
<text class="tick" x="235" y="264" text-anchor="middle">100</text>
<line class="grid" x1="382" y1="88" x2="382" y2="248"/>
<text class="tick" x="382" y="264" text-anchor="middle">1,000</text>
<line class="grid" x1="529" y1="88" x2="529" y2="248"/>
<text class="tick" x="529" y="264" text-anchor="middle">10k</text>
<line class="grid" x1="676" y1="88" x2="676" y2="248"/>
<text class="tick" x="676" y="264" text-anchor="middle">100k</text>
<line class="axis" x1="235" y1="88" x2="235" y2="248"/>
<g><title>applyOp · one move on a tree of 5 000 moves
277 ops/s
3.61 ms per operation</title>
