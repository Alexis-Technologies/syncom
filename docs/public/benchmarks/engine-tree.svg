<text class="sublabel" x="20" y="160">the fold of 5 000 moves, anew</text>
<path class="bar primary" d="M235,141H303.02389647545067A4,4 0 0 1 307.02389647545067,145V151A4,4 0 0 1 303.02389647545067,155H235Z"/>
<text class="value" x="313.02389647545067" y="154">309</text>
</g>
<g><title>renderTree · the fold kept by the block
13,978 ops/s
71.5 µs per operation</title>
<text class="label primary" x="20" y="185">renderTree</text>
<text class="sublabel" x="20" y="200">the fold kept by the block</text>
<path class="bar primary" d="M235,181H546.3804203122573A4,4 0 0 1 550.3804203122573,185V191A4,4 0 0 1 546.3804203122573,195H235Z"/>
