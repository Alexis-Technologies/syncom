<text class="sublabel" x="20" y="240">among 300 siblings (memory fsi)</text>
<path class="bar primary" d="M235,221H405.06613307323164A4,4 0 0 1 409.06613307323164,225V231A4,4 0 0 1 405.06613307323164,235H235Z"/>
