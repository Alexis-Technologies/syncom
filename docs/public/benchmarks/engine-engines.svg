</style>
<text class="title" x="20" y="35">Engines: syncom's own benchmarks</text>
<text class="subtitle" x="20" y="56">The same database over every engine: the files engine on node:fs, memory, SQLite, IndexedDB (fake-indexeddb</text>
<text class="subtitle" x="20" y="73">under Node), MongoDB (the driver in memory) — the chain off. ops/s, log scale, higher is better.</text>
