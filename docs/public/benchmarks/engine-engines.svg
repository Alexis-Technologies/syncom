<svg xmlns="http://www.w3.org/2000/svg" width="760" height="948" viewBox="0 0 760 948" role="img" aria-label="Engines: syncom's own benchmarks. The same database over every engine: the files engine on node:fs, memory, SQLite, IndexedDB (fake-indexeddb under Node), MongoDB (the driver in memory) — the chain off. ops/s, log scale, higher is better.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 700; fill: #1b1c1e; }
  .subtitle, .caption { font-size: 12px; fill: #67676c; }
  .caption { font-size: 11px; }
