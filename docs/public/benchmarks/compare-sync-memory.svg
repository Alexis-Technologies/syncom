<svg xmlns="http://www.w3.org/2000/svg" width="760" height="621" viewBox="0 0 760 621" role="img" aria-label="Replicate a store, in memory. An empty replica pulls a store of 1,000 records, in process, through the library's own sync protocol, until every record reads back. Nothing touches the disk. records/s, log scale, higher is better. Not shown: Fireproof (syncs through a cloud or self-hosted gateway only); GUN (needs its storage adapter to answer in Node.js).">
