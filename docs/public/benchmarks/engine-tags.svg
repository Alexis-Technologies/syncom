<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348" role="img" aria-label="Tags: syncom's own benchmarks. Named versions: a tag over a thousand records, writes under it (the first copies the file), reads at the tag. ops/s, log scale, higher is better.">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 700; fill: #1b1c1e; }
  .subtitle, .caption { font-size: 12px; fill: #67676c; }
  .caption { font-size: 11px; }
  .group { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; fill: #67676c; }
  .label { font-size: 13px; font-weight: 600; fill: #1b1c1e; }
  .label.primary, .label.secondary { font-weight: 700; }
  .sublabel { font-size: 11px; fill: #67676c; }
  .value { font-size: 12px; font-weight: 600; fill: #3c3c43; font-variant-numeric: tabular-nums; }
  .value.small { font-size: 10px; }
  .legend { font-size: 11px; fill: #3c3c43; }
  .tick { font-size: 11px; fill: #67676c; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e4e4e7; stroke-width: 1; }
  .axis { stroke: #c2c2c4; stroke-width: 1; }
  .ref { stroke: #67676c; stroke-width: 1; stroke-dasharray: 3 3; }
  .bar { fill: #c4c6cc; }
  .bar.primary { fill: #245a9e; }
  .bar.secondary { fill: #5e9be6; }
  @media (prefers-color-scheme: dark) {
    .title, .label { fill: #dfdfd6; }
    .subtitle, .caption, .group, .sublabel, .tick { fill: #98989f; }
    .value, .legend { fill: #c2c2c4; }
    .grid { stroke: #2e2e32; }
    .axis { stroke: #48484c; }
    .ref { stroke: #98989f; }
    .bar { fill: #46474e; }
    .bar.primary { fill: #8dbcf2; }
    .bar.secondary { fill: #3d7bd0; }
  }
</style>
<text class="title" x="20" y="35">Tags: syncom's own benchmarks</text>
<text class="subtitle" x="20" y="56">Named versions: a tag over a thousand records, writes under it (the first copies the file), reads at the tag.</text>
<text class="subtitle" x="20" y="73">ops/s, log scale, higher is better.</text>
<line class="grid" x1="371" y1="88" x2="371" y2="288"/>
<text class="tick" x="371" y="304" text-anchor="middle">1,000</text>
<line class="grid" x1="472.66666666666663" y1="88" x2="472.66666666666663" y2="288"/>
<text class="tick" x="472.66666666666663" y="304" text-anchor="middle">10k</text>
<line class="grid" x1="574.3333333333333" y1="88" x2="574.3333333333333" y2="288"/>
<text class="tick" x="574.3333333333333" y="304" text-anchor="middle">100k</text>
<line class="grid" x1="676" y1="88" x2="676" y2="288"/>
<text class="tick" x="676" y="304" text-anchor="middle">1M</text>
<line class="axis" x1="371" y1="88" x2="371" y2="288"/>
<g><title>tag() + untag() · over 1 000 records (memory fsi)
2,900 ops/s
345 µs per operation</title>
<text class="label primary" x="20" y="105">tag() + untag()</text>
<text class="sublabel" x="20" y="120">over 1 000 records (memory fsi)</text>
<path class="bar primary" d="M371,101H414.0104631197272A4,4 0 0 1 418.0104631197272,105V111A4,4 0 0 1 414.0104631197272,115H371Z"/>
<text class="value" x="424.0104631197272" y="114">2,900</text>
</g>
<g><title>update · under a tag; the first write of a record copies its file
18,687 ops/s
53.5 µs per operation</title>
<text class="label primary" x="20" y="145">update</text>
<text class="sublabel" x="20" y="160">under a tag; the first write of a record copies its file</text>
<path class="bar primary" d="M371,141H496.2731912020367A4,4 0 0 1 500.2731912020367,145V151A4,4 0 0 1 496.2731912020367,155H371Z"/>
<text class="value" x="506.2731912020367" y="154">18.7k</text>
</g>
<g><title>at(tag).get · a record copied at the tag
2,431 ops/s
411 µs per operation</title>
<text class="label primary" x="20" y="185">at(tag).get</text>
<text class="sublabel" x="20" y="200">a record copied at the tag</text>
<path class="bar primary" d="M371,181H406.2214708157391A4,4 0 0 1 410.2214708157391,185V191A4,4 0 0 1 406.2214708157391,195H371Z"/>
<text class="value" x="416.2214708157391" y="194">2,431</text>
</g>
<g><title>get(id, { at: { tag } }) · through the read hooks
2,461 ops/s
406 µs per operation</title>
<text class="label primary" x="20" y="225">get(id, { at: { tag } })</text>
<text class="sublabel" x="20" y="240">through the read hooks</text>
<path class="bar primary" d="M371,221H406.7630140597849A4,4 0 0 1 410.7630140597849,225V231A4,4 0 0 1 406.7630140597849,235H371Z"/>
<text class="value" x="416.7630140597849" y="234">2,461</text>
</g>
<g><title>at(tag).list · the tag’s catalog, 1 000 ids
799,036 ops/s
1.25 µs per operation</title>
<text class="label primary" x="20" y="265">at(tag).list</text>
<text class="sublabel" x="20" y="280">the tag’s catalog, 1 000 ids</text>
<path class="bar primary" d="M371,261H662.0942452360914A4,4 0 0 1 666.0942452360914,265V271A4,4 0 0 1 662.0942452360914,275H371Z"/>
<text class="value" x="672.0942452360914" y="274">799k</text>
</g>
<text class="caption" x="20" y="329">pnpm bench --save · Apple M3 Max · 16 cores · Node v24.14.1 · 1 s per row · 2026-10-27</text>
</svg>
