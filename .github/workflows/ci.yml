name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # The package checks first and fast: exports, files, the browser map,
      # the invariants' tests, the error codes, the guides' paths.
      - run: node --test --test-timeout=60000 --test-force-exit tests/package/*.test.js
      # Smoke: keeps the bundle-size script working and its numbers visible in
      # CI logs. It also enforces the browser budget and rejects any bare
      # import that reaches a browser bundle.
      - run: pnpm size

  test:
    runs-on: ubuntu-latest
    # RSA-2048 key generation runs once per Storage and the chain benchmarks
    # are filesystem-bound, so a wedged test costs real time — cap the job
    # rather than let a hang burn the six-hour default.
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The MongoDB engine's test over the real driver (tests/engine.mongodb.test.js) runs when MONGODB_URL is
      # set; change streams and transactions need a replica set, so the service is one of one member.
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0
      - run: pnpm test:coverage
        env:
          MONGODB_URL: mongodb://localhost:27017/?replicaSet=rs0
      - run: pnpm test:types

  # Node 24 only: the docs build exercises VitePress, not the package runtime,
  # so repeating it across the test matrix would just repeat the same work.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A broken docs build (including dead links) should fail the PR, not the deploy.
      - run: pnpm run docs:build

  # The package on the other runtimes: a smoke of a database in memory and two nodes over an in-process link
  # (tests/smoke/smoke.js, plain node:assert) — what Deno's and Bun's Node compatibility has to carry for
  # `require('@alexify/syncom')` to work there. Neither runs the suite: node:test is Node's.
  smoke-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read --allow-write --allow-env --allow-sys tests/smoke/smoke.js

  smoke-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - run: bun tests/smoke/smoke.js
